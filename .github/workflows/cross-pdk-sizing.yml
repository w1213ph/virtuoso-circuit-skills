name: Cross-PDK ADC bias sizing and waveform replay
on:
  workflow_dispatch:
    inputs:
      requirements:
        description: 'Confirmed ADC mirror requirements as JSON (blank runs the 10 µA / 200 fF example)'
        type: string
        required: false
  push:
    paths:
      - 'examples/cross-pdk-current-mirror/**'
      - 'examples/sky130-current-mirror/**'
      - 'skills/paper-to-virtuoso/scripts/check_prelayout.py'
      - 'skills/paper-to-virtuoso/scripts/device_headroom.py'
      - '.github/workflows/cross-pdk-sizing.yml'
  pull_request:
    paths:
      - 'examples/cross-pdk-current-mirror/**'
      - 'examples/sky130-current-mirror/**'
      - 'skills/paper-to-virtuoso/scripts/check_prelayout.py'
      - 'skills/paper-to-virtuoso/scripts/device_headroom.py'
      - '.github/workflows/cross-pdk-sizing.yml'
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 15
    steps:
      - name: Install native tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-matplotlib ngspice xschem xvfb xauth fonts-dejavu-core
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reproduce the two-size 250 fF reference
        if: github.event_name != 'workflow_dispatch' || inputs.requirements == ''
        run: |
          python3 examples/cross-pdk-current-mirror/transfer.py run --out work/reference
          python3 examples/cross-pdk-current-mirror/transfer.py verify --out work/reference
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/reference/summary.json").read_text())
          sky, gf = [report["processes"][name] for name in ("sky130", "gf180")]
          assert sky["selected"] == gf["selected"] == "short"
          assert sum(sky["points"].values()) == 12600 and sum(gf["points"].values()) == 23040
          assert [p["designs"]["short"]["sizing"]["width_um"] for p in (sky, gf)] == [2.8, 6.1]
          limit = report["requirements"]["max_settling_ns"]
          assert gf["designs"]["short"]["worst_settling_ns"] <= limit < gf["designs"]["long"]["worst_settling_ns"]
          control = report["copied_control"]
          assert control["worst_error_pct"] < report["requirements"]["max_error_pct"]
          assert control["corners"]["ss"]["metrics"]["settling_ns"] > limit
          PY
      - name: Size both circuits for the requested load and replay every measured candidate
        env:
          BIAS_REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          here = Path("examples/cross-pdk-current-mirror")
          work = Path("work")
          work.mkdir(exist_ok=True)
          custom = os.environ.get("BIAS_REQUIREMENTS", "")
          req = here / "sizing.example.json"
          if custom:
              req = work / "requested.json"
              req.write_text(custom, encoding="utf-8")
          out = work / "transfer"
          cli = [sys.executable, str(here / "transfer.py")]
          measured = subprocess.run(cli + ["run", "--optimize", "--requirements", str(req), "--out", str(out)]).returncode
          if measured not in (0, 1):
              raise SystemExit(measured)
          replayed = subprocess.run(cli + ["verify", "--out", str(out)]).returncode
          report = json.loads((out / "summary.json").read_text())
          assert measured == replayed == (0 if report["qualified_in_both"] else 1)
          supplied = json.loads(req.read_text())
          assert all(report["requirements"].get(k) == v for k,v in supplied.items() if k != "assumed_fields")
          if not custom:
              assert measured == 0 and all(p["selected"] for p in report["processes"].values())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(("两种工艺各有达标尺寸。" if not measured else "本次规格有工艺未找到达标尺寸。") + "\n\n")
              f.write("下载 `adc-bias-project` 后解压，打开 `index.html` 看图，在工程根目录运行 `python bias.py` 从原始数据复算。\n\n")
              f.write(re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", (out / "RESULTS.md").read_text()))
          PY
      - name: Measure held-out gate-bias error in all six native device tables
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "skills/paper-to-virtuoso/scripts")
          from device_headroom import crosscheck, read_curves

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n| PDK | Corner | Curves | Held-out points | Max VGS error (mV) | Max gm/ID error (%) |\n")
              out.write("|---|---|---:|---:|---:|---:|\n")
              for process in ("sky130", "gf180"):
                  for corner in ("tt", "ss", "ff"):
                      path = Path("work/transfer") / process / "lut" / corner / "table.csv"
                      result = crosscheck(read_curves(path))
                      curves, points = result["curves"], result["withheld_points"]
                      voltage, efficiency = result["max_gate_error_mV"], result["max_relative_gm_id_error_percent"]
                      line = f"| {process} | {corner} | {curves} | {points} | {voltage:.4f} | {efficiency:.4f} |"
                      print(line, flush=True)
                      out.write(line + "\n")
                      if curves != 24 or voltage > 3 or efficiency > 5:
                          raise ValueError(f"Review interpolation accuracy on the pinned {process} {corner} sweep")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cross-pdk-bias-evidence
          path: |
            work/transfer/
            !work/transfer/models/**
          if-no-files-found: error
      - name: Open the measured core, symbol and testbench in Xschem and export their images
        run: xvfb-run -a python3 examples/cross-pdk-current-mirror/preview.py --out work/transfer --images work/previews
      - name: Assemble the requested project and replay using only its own source
        run: |
          python3 examples/cross-pdk-current-mirror/project.py --out work/transfer --images work/previews --project work/project --revision "$GITHUB_SHA"
          python3 - <<'PY'
          import json, pathlib, subprocess, sys, tempfile
          project = pathlib.Path("work/project").resolve()
          with tempfile.TemporaryDirectory() as empty:
              replay = subprocess.run([sys.executable, "-IB", str(project / "bias.py")], cwd=empty)
          both = json.loads((project / "evidence/summary.json").read_text())["qualified_in_both"]
          assert replay.returncode == (0 if both else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adc-bias-project
          path: work/project/
          if-no-files-found: error
      - name: Start from the delivered tools and design for the 275 fF first-use exercise
        if: github.event_name != 'workflow_dispatch'
        run: |
          example=examples/cross-pdk-current-mirror
          measured=0
          python3 -IB work/project/bias.py run --requirements "$example/first-use.json" --out work/first-use --sky130-models work/transfer/models/sky130 --gf180-models work/transfer/models/gf180 || measured=$?
          test "$measured" -le 1
          xvfb-run -a python3 "$example/preview.py" --out work/first-use --images work/first-use-previews
          python3 "$example/project.py" --out work/first-use --images work/first-use-previews --project work/first-use-project --revision "$GITHUB_SHA"
          replayed=0
          python3 -IB work/first-use-project/bias.py || replayed=$?
          test "$measured" -eq "$replayed"
          python3 - <<'PY'
          import json
          from pathlib import Path
          req = json.loads(Path("examples/cross-pdk-current-mirror/first-use.json").read_text())
          out = Path("work/first-use-project/evidence")
          report = json.loads((out / "summary.json").read_text())
          assert report["requirements"] == req
          for proc, data in report["processes"].items():
              name = data["selected"] or data["diagnostic"]
              bench = (out / proc / name / "views/TB_BIAS_MIRROR.spice").read_text().lower()
              assert "cref iref 0 275f" in bench
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: adc-bias-first-use-275ff
          path: work/first-use-project/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cross-pdk-schematic-previews
          path: work/previews/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch' || inputs.requirements == ''
        with:
          name: cross-pdk-reference-250fF
          path: |
            work/reference/
            !work/reference/models/**
          if-no-files-found: error
