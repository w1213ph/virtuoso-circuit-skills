name: SKY130 mirror, ADC driver and programmable gain pre-layout simulation
on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/sky130-current-mirror/**'
      - 'examples/sky130-adc-driver/**'
      - 'examples/sky130-programmable-gain/**'
      - 'skills/paper-to-virtuoso/scripts/check_prelayout.py'
      - '.github/workflows/sky130-prelayout.yml'
  pull_request:
    paths:
      - 'examples/sky130-current-mirror/**'
      - 'examples/sky130-adc-driver/**'
      - 'examples/sky130-programmable-gain/**'
      - 'skills/paper-to-virtuoso/scripts/check_prelayout.py'
      - '.github/workflows/sky130-prelayout.yml'
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 15
    steps:
      - name: Install Xschem and ngspice
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 xschem ngspice
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Characterize the PDK and simulate both native schematics
        run: python3 examples/sky130-current-mirror/run.py --out work/mirror
      - name: Verify the three corners and six candidate measurements
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('work/mirror')
          status = json.loads((root / 'status.json').read_text())
          assert status['status'] == 'completed'
          assert {r['corner']: (r['curves'], r['points'], r['mode']) for r in status['characterization']} == {
              'tt': (24, 4344, 'measured'), 'ss': (24, 3912, 'measured'), 'ff': (24, 4344, 'measured')}
          tests = json.loads((root / 'candidate/checked.json').read_text())['tests']
          assert {row['id'] for row in tests if row['status'] == 'PASS'} == {
              c + '.' + m for c in ('tt', 'ss', 'ff') for m in ('ratio', 'settling')}
          PY
          cat work/mirror/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build the smaller qualified design for a different ADC bias request
        run: |
          ex=examples/sky130-current-mirror
          python3 "$ex/run.py" --requirements "$ex/adc-bias.example.json" --models work/mirror/models --reuse-lut work/mirror/characterization --out work/adc-bias
          python3 - <<'PY'
          import json
          from pathlib import Path
          out = Path("work/adc-bias")
          def read(path):
              return json.loads((out / path).read_text())
          request = json.loads(Path("examples/sky130-current-mirror/adc-bias.example.json").read_text())
          assert read("requirements.json") == request
          status = read("status.json")
          assert status["status"] == "completed" and not status["defaulted_fields"]
          assert status["selection"] == {"policy": "min_gate_area", "passing_variants": ["baseline", "candidate"], "selected_variant": "baseline"}
          areas = []
          for variant in ("baseline", "candidate"):
              assert read(variant + "/native-readback.json")["reference_load_fF"] == 250
              assert "CREF IREF 0 250f m=1" in (out / variant / "views/TB_BIAS_MIRROR.spice").read_text()
              tests = read(variant + "/checked.json")["tests"]
              assert len(tests) == 6 and all(t["status"] == "PASS" for t in tests)
              for t in tests:
                  assert t["limits"]["<="] == (8 if t["id"].endswith(".ratio") else 40)
              areas.append(read(variant + "/sizing.json")["mirror_pair_gate_area_um2"])
          assert areas[0] < areas[1] and "sh baseline/open.sh bench" in (out / "RESULTS.md").read_text()
          PY
          cat work/adc-bias/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Resize for 5 uA and retain failed requirements
        run: |
          expect_review() {
            if python3 examples/sky130-current-mirror/run.py --models work/mirror/models --reuse-lut work/mirror/characterization "$@"; then
              echo "The reference design no longer reproduces the expected limit misses."
              return 1
            else
              test "$?" -eq 1
            fi
          }
          expect_review --reference-ua 5 --out work/mirror-5ua
          expect_review --max-error-pct 4 --out work/mirror-4pct
          python3 examples/sky130-current-mirror/run.py --models work/mirror/models --reuse-lut work/mirror/characterization --reference-ua 5 --candidate-length-um 1.5 --out work/mirror-5ua-long
          python3 - <<'PY'
          import json
          from pathlib import Path
          def read(root, file):
              return json.loads((Path('work') / root / file).read_text())
          for folder in ('mirror-5ua', 'mirror-4pct'):
              status = read(folder, 'status.json')
              assert status['status'] == 'review_required' and all(r['mode'] == 'reused' for r in status['characterization'])
          for variant in ('baseline', 'candidate'):
              original = read('mirror', variant + '/sizing.json')
              resized = read('mirror-5ua', variant + '/sizing.json')
              assert resized['reference_current_uA'] == 5 and resized['width_um'] < original['width_um']
          strict = read('mirror-4pct', 'candidate/checked.json')['tests']
          assert {r['id'] for r in strict if r['status'] == 'FAIL'} == {'tt.ratio', 'ff.ratio'}
          half = read('mirror-5ua', 'candidate/checked.json')['tests']
          assert {r['id'] for r in half if r['status'] == 'FAIL'} == {'ff.ratio'}
          retry = read('mirror-5ua-long', 'status.json')
          assert retry['status'] == 'completed'
          assert all(r['mode'] == 'measured' and r['recipe']['lengths_um'] == [0.5, 1.5] for r in retry['characterization'])
          assert read('mirror-5ua-long', 'requirements.json') == read('mirror-5ua', 'requirements.json')
          assert all(r['status'] == 'PASS' for r in read('mirror-5ua-long', 'candidate/checked.json')['tests'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky130-current-mirror
          path: |
            work/mirror/RESULTS.md
            work/mirror/requirements.json
            work/mirror/status.json
            work/mirror/comparison.json
            work/mirror/common/
            work/mirror/characterization/*/manifest.json
            work/mirror/characterization/*/table.csv
            work/mirror/baseline/
            work/mirror/candidate/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky130-alternative-requirements
          path: |
            work/mirror-5ua/RESULTS.md
            work/mirror-5ua/requirements.json
            work/mirror-5ua/comparison.json
            work/mirror-5ua/candidate/
            work/mirror-5ua-long/RESULTS.md
            work/mirror-5ua-long/requirements.json
            work/mirror-5ua-long/comparison.json
            work/mirror-5ua-long/candidate/
            work/mirror-4pct/RESULTS.md
            work/mirror-4pct/requirements.json
            work/mirror-4pct/comparison.json
            work/mirror-4pct/candidate/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky130-adc-bias
          path: work/adc-bias/
      - name: Drive a switched ADC input and verify both clock states and step directions
        run: |
          ex=examples/sky130-adc-driver
          python3 "$ex/run.py" --models work/mirror/models --reuse-lut work/mirror/characterization --out work/adc-driver
          python3 "$ex/verify_results.py" work/adc-driver > work/driver-check.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          read = lambda p: json.loads(Path(p).read_text())
          result = read("work/driver-check.json")
          assert result["selected"] == "candidate" and result["pass_counts"] == {"baseline": 14, "candidate": 18}
          for design in ("baseline", "candidate"):
              rows = read("work/adc-driver/" + design + "/checked.json")["tests"]
              diagnostic = {r["id"] for r in rows if r["status"] == "DIAGNOSTIC_MEASURED" and r["role"] == "diagnostic"}
              assert diagnostic == {c + "." + edge + ".switch_drop" for c in ("tt","ss","ff") for edge in ("up","down")}
          for c in ("tt", "ss", "ff"):
              assert read("work/adc-driver/characterization/" + c + "/manifest.json")["mode"] == "reused"
          r = read("examples/sky130-adc-driver/requirements.example.json")
          r.update(adc_bits=8, purpose="Check the same sampling step against an eight-bit error budget")
          Path("work/eight-bit.json").write_text(json.dumps(r))
          PY
          cat work/adc-driver/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          status=0
          python3 "$ex/run.py" --models work/mirror/models --reuse-lut work/mirror/characterization --requirements work/eight-bit.json --out work/driver-8bit || status=$?
          test "$status" = 1
          python3 "$ex/verify_results.py" work/driver-8bit > work/driver-8bit-check.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("work/driver-8bit-check.json").read_text())
          assert result["status"] == "review_required" and result["selected"] is None
          assert all(0 < n < 18 for n in result["pass_counts"].values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky130-adc-sampling-driver
          path: |
            work/adc-driver/
            work/driver-8bit/
      - name: Measure four gain codes at the receiver and settle both control transitions
        run: |
          ex=examples/sky130-programmable-gain
          python3 "$ex/run.py" --models work/mirror/models --reuse-lut work/mirror/characterization --out work/gain
          python3 "$ex/verify_results.py" work/gain > work/gain-check.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          read = lambda p: json.loads(Path(p).read_text(encoding="utf-8"))
          result = read("work/gain-check.json")
          assert result["selected"] == "candidate" and result["pass_counts"] == {"baseline":34,"candidate":42}
          checked = read("work/gain/baseline/checked.json")
          assert [(x["planned"], x["missing"]) for x in checked["coverage"]] == [(12,0),(6,0)]
          rows = {t["id"]:t for t in checked["tests"]}
          assert abs(rows["ss.00.drive_high_dB"]["value"]) < 1.5 and rows["ss.00.max_gain_error_dB"]["status"] == "FAIL"
          for corner in ("tt","ss","ff"):
              assert read("work/gain/characterization/"+corner+"/manifest.json")["mode"] == "reused"
          r = read("examples/sky130-programmable-gain/requirements.example.json")
          r.update(purpose="Honor a tighter supply-current budget on the same loaded gain stage",max_supply_uA=20)
          Path("work/gain-20ua.json").write_text(json.dumps(r))
          PY
          status=0
          python3 "$ex/run.py" --requirements work/gain-20ua.json --models work/mirror/models --reuse-lut work/mirror/characterization --out work/gain-20ua || status=$?
          test "$status" = 1
          python3 "$ex/verify_results.py" work/gain-20ua > work/gain-20ua-check.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("work/gain-20ua-check.json").read_text())
          assert result["status"] == "review_required" and not result["passing_variants"] and result["selected"] is None
          PY
          cat work/gain/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky130-programmable-gain
          path: |
            work/gain/
            work/gain-20ua/
